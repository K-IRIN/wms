spring:
  datasource:
    url: jdbc:mysql://localhost:3306/wms_it?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: ${DB_PASSWORD:}
    hikari:
      # 并发用例最多 32 个线程同时建单，连接池给足，避免等待超时掩盖真实问题
      maximum-pool-size: 40

jwt:
  # 仅测试环境使用的固定密钥（>=32 字节），不是生产密钥
  secret: ${JWT_SECRET:test-only-jwt-secret-0123456789abcdef0123456789abcdef}
  expire: 86400000

agv:
  enabled: false
